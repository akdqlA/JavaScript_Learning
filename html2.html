<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * { box-sizing: border-box }
        #result {width: 180px; height:50px; margin: 5px; text-align: right }
        #operator {width: 50px; height: 50px; margin: 5px; text-align: center }
        button {width: 50px; height: 50px; margin: 5px }
    </style>
</head>
<body>
    <input readonly id="operator">
    <input readonly type="number" id="result">
    <div class="row">
        <button id="n7">7</button>
        <button id="n8">8</button>
        <button id="n9">9</button>
        <button id="plus">+</button>
    </div>
    <div class="row">
        <button id="n4">4</button>
        <button id="n5">5</button>
        <button id="n6">6</button>
        <button id="minus">-</button>
    </div>
    <div class="row">
        <button id="n1">1</button>
        <button id="n2">2</button>
        <button id="n3">3</button>
        <button id="divide">/</button>
    </div>
    <div class="row">
        <button id="clear">C</button>
        <button id="n0">0</button>
        <button id="calculate">=</button>
        <button id="multiply">x</button>
    </div>
    <script>
        let numOne = '';
        let operator = '';
        let numTwo = '';
        const $operator = document.querySelector('#operator');
        const $result = document.querySelector("#result");
        const onClickNumber = (event) => {
            if(!operator){
                numOne += event.target.textContent;
                $result.value += event.target.textContent;
                return;
            }
            if(!numTwo) {
                $result.value = '';
            }
            numTwo += event.target.textContent;
            $result.value += event.target.textContent;
        }
        document.querySelector('#n0').addEventListener('click', onClickNumber);
        document.querySelector('#n1').addEventListener('click', onClickNumber);
        document.querySelector('#n2').addEventListener('click', onClickNumber);
        document.querySelector('#n3').addEventListener('click', onClickNumber);
        document.querySelector('#n4').addEventListener('click', onClickNumber);
        document.querySelector('#n5').addEventListener('click', onClickNumber);
        document.querySelector('#n6').addEventListener('click', onClickNumber);
        document.querySelector('#n7').addEventListener('click', onClickNumber);
        document.querySelector('#n8').addEventListener('click', onClickNumber);
        document.querySelector('#n9').addEventListener('click', onClickNumber);

        const onClickOperator = (op) => () => {
            if(numOne) {
                operator = op;
                $operator.value = op;
            } else
                alert('숫자를 먼저 입력하세요.');
        }
        document.querySelector('#plus').addEventListener('click', onClickOperator('+'));
        document.querySelector('#minus').addEventListener('click', onClickOperator('-'));
        document.querySelector('#divide').addEventListener('click', onClickOperator('/'));
        document.querySelector('#multiply').addEventListener('click', onClickOperator('*'));
        document.querySelector('#calculate').addEventListener('click', () => {});
        if(numTwo) {
            switch(operator){
                case '+':
                    $result.value = parseInt(numOne) + parseInt(numTwo);
                    break;
                case '-':
                    $result.value = numOne - numTwo;
                    break;
                case '*':
                    $result.value = numOne * numTwo;
                    break;
                case '/':
                    $result.value = numOne / numTwo;
                    break;
                default:
                    break;
            }
            numOne = '';
            operator = '';
            numTwo = '';
            $operator.value = '';
        } else
            alert('숫자를 먼저 입력하세요.');
        document.querySelector('#clear').addEventListener('click', () => {
            numOne = '';
            operator = '';
            numTwo = '';
            $operator.value = '';
            $result.value = '';
        });
    </script>
</body>
</html>
