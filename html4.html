<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball {
            display: inline-block;
            border: 1px solid black;
            border-radius: 20px;
            width:40px;
            height:40px;
            line-height:40px;
            font-size:20px;
            text-align: center;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <form id="form">
        <input name="input" placeholder="숫자 6개를 쉼표로 구분해 입력하세요.">
        <button>추첨</button>
    </form>
    <div id="result">당첨 숫자:</div>
    <div id="bonus">보너스 숫자:</div>
    <script>
        const form = document.querySelector('#form');
        const result = document.querySelector('#result');
        const bonus = document.querySelector('#bonus');
        const setTimeoutPromise = (ms) => new Promise((resolve,reject) => {
            setTimeout(resolve,ms);
        })
        form.addEventListener('submit', async (event) =>{
            event.preventDefault();
            const string = event.target.input.value;
            if(!string.trim())//공백 제거해서 0이면 false
                return alert('숫자를 입력하세요.');
            const myNumbers = string.split(',').map((v) => parseInt(v.trim()));
            if(myNumbers.length != 6)
                return alert('숫자를 6개 입력하세요.');
            if(new Set(myNumbers).size != 6)
                return alert('중복된 숫자를 입력했습니다.');
            if(myNumbers.find((v) => v > 45 || v < 1))
                return alert('1부터 45까지만 입력할 수 있습니다.');
            const candidate = Array(45).fill().map((v,i) => i + 1);
            const shuffle = [];
            while(candidate.length){
                const random = candidate.splice(Math.floor(Math.random() * candidate.length),1)[0];
                const spliceArray = candidate.splice(random,1);
                const value = spliceArray[0];
                shuffle.push(random);
            }
            const balls = shuffle.slice(0,6).sort((a,b) => a - b);
            const bonusball = shuffle[6];
            function drawBall(target,value){
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.textContent = value;
                target.appendChild(ball);
            }
            for(let i = 0 ; i < 6 ; i ++){
                await setTimeoutPromise(1000);
                drawBall(result,balls[i]);
            }
            await setTimeoutPromise(1000);
            drawBall(bonus,bonusball);
            await setTimeoutPromise(200);
            let count = 0;
            myNumbers.forEach((my) => {
                if( balls.includes(my))
                    count++;
            });
            if(count == 6)
                alert('1등! 현실 로또 당첨될 운을 여기에 쓰시다니...');
            else if(count == 5){
                if(myNumbers.includes(bonus)) alert('2등! 보너스 공이지만 숫자 6개를 맞추셨네요.');
                else alert('3등! 아쉽습니다. 그래도 축하드려요.');
            } else if(count == 4) alert('4등! 5만 원 축하드려요.');
            else if(count == 3) alert('5등! 5천 원 축하드려요.');
            else alert('꽝.');
        });
    </script>
</body>
</html>
