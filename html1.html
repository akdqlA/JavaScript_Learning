<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기</title>
    <style>

    </style>
</head>
<body>
    <div><span id="order">1</span>번째 참가자</div>
    <div>제시어(3글자 이하): <span id="word"></span></div>
    <input type="text">
    <button>입력</button>
    <script>
        let number = prompt('몇 명이 참가하나요?');
        if(number==null){
            console.log("A");
            window.close();
        }
        const btn = document.querySelector('button');
        const inp = document.querySelector('input');
        const word = document.querySelector('#word');
        const $order = document.querySelector('#order');
        let w1;
        let w2;
        const onClickButton = () => {
            if(!w1 || w1[w1.length-1] == w2[0]){
                w1 = w2;
                if(w1.length <= 3)
                {
                    word.textContent = w1;
                    const order = Number($order.textContent);
                    if(order + 1 > number)
                        $order.textContent = 1;
                    else 
                        $order.textContent = order+1;
                }
                else
                alert('3글자 초과한 단어입니다.');
            }else
                alert('올바르지 않은 단어입니다.');
            inp.value = '';
            inp.focus();
        };
        const onInput = (event) => {
            w2 = event.target.value;
        };

        btn.addEventListener('click',onClickButton);
        inp.addEventListener('input',onInput);
    </script>
</body>
</html>
